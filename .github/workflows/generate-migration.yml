name: Generate EF migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/generate-migration.yml'

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        if: ${{ hashFiles('src/ReviMarket.Web/Data/Migrations/*_InitialCreate.cs') == '' }}
        run: dotnet restore src/ReviMarket.Web/ReviMarket.Web.csproj

      - name: Install dotnet-ef
        if: ${{ hashFiles('src/ReviMarket.Web/Data/Migrations/*_InitialCreate.cs') == '' }}
        run: dotnet tool install --global dotnet-ef --version 8.0.10

      - name: Build
        if: ${{ hashFiles('src/ReviMarket.Web/Data/Migrations/*_InitialCreate.cs') == '' }}
        run: dotnet build src/ReviMarket.Web/ReviMarket.Web.csproj --configuration Release --no-restore

      - name: Generate initial migration
        if: ${{ hashFiles('src/ReviMarket.Web/Data/Migrations/*_InitialCreate.cs') == '' }}
        run: dotnet ef migrations add InitialCreate --project src/ReviMarket.Web/ReviMarket.Web.csproj --startup-project src/ReviMarket.Web/ReviMarket.Web.csproj --output-dir Data/Migrations --configuration Release --no-build

      - name: Commit generated migration
        if: ${{ hashFiles('src/ReviMarket.Web/Data/Migrations/*_InitialCreate.cs') == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReviMarket.Web/Data/Migrations
          git commit -m "Add initial EF Core migration"
          git push origin HEAD:${{ github.head_ref }}
