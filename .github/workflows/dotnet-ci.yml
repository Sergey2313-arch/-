name: ReviMarket .NET CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/dotnet-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ReviMarket.Web/ReviMarket.Web.csproj

      - name: Build
        run: dotnet build src/ReviMarket.Web/ReviMarket.Web.csproj --configuration Release --no-restore

      - name: Publish self-contained preview
        run: dotnet publish src/ReviMarket.Web/ReviMarket.Web.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: revimarket-linux-x64
          path: publish/
          if-no-files-found: error
