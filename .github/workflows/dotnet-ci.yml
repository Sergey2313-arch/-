name: ReviMarket .NET CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/dotnet-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/ReviMarket.Web.Tests/ReviMarket.Web.Tests.csproj

      - name: Build web application
        run: dotnet build src/ReviMarket.Web/ReviMarket.Web.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/ReviMarket.Web.Tests/ReviMarket.Web.Tests.csproj --configuration Release --no-restore --verbosity normal
